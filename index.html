<style>
/* Layout: icon rail + settings panel on the start (right) side, scrolling paper stack on the rest. */
:root{
  --bg:#F6F2EE; --surface:#FFFFFF; --surface2:#EFE8E2; --line:#E2D7CE; --fg:#2A1A1F; --muted:#77656B;
  --brand:#84263E; --brand-ink:#FFFFFF; --gold:#B88A3E; --focus:#C59D56; --desk:#E9E1DA; --danger:#B3261E;
  --font-ui:"Tajawal","Segoe UI","Tahoma",sans-serif; --font-display:"Reem Kufi","Tajawal","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1416; --surface:#251C1F; --surface2:#30252A; --line:#43353A; --fg:#F3E9EC; --muted:#B5A2A8;
  --brand:#C2566F; --brand-ink:#FFFFFF; --gold:#D9B36E; --focus:#D9B36E; --desk:#141012; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1416; --surface:#251C1F; --surface2:#30252A; --line:#43353A; --fg:#F3E9EC; --muted:#B5A2A8;
  --brand:#C2566F; --brand-ink:#FFFFFF; --gold:#D9B36E; --focus:#D9B36E; --desk:#141012; --danger:#F2867E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand h1{font-family:var(--font-display);font-size:22px;margin:0;color:var(--brand);font-weight:700;letter-spacing:0}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.top .grow{flex:1}
.docname{min-width:0;flex:1 1 180px;max-width:320px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.main{display:grid;grid-template-columns:76px 340px 1fr;min-height:0}
.rail{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow:auto}
.rail button{border:0;background:none;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--muted);font-size:11.5px}
.rail button svg{width:22px;height:22px}
.rail button[aria-selected="true"]{background:var(--surface2);color:var(--brand);font-weight:700}
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 40px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:18px;margin:0 0 4px;color:var(--brand);font-weight:700}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.6}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:grid;gap:10px}
.sec>h3{margin:0;font-size:13px;letter-spacing:.2px;color:var(--fg)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>label{flex:0 0 96px;color:var(--muted);font-size:12.5px}
.row>.ctl{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--brand)}
.row output{min-width:44px;text-align:left;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:var(--bg);padding:6px 8px;cursor:pointer;font-size:12.5px;min-width:36px}
.seg button+button{border-right:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{accent-color:var(--brand);width:16px;height:16px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery.two{grid-template-columns:repeat(2,1fr)}
.gallery.four{grid-template-columns:repeat(4,1fr)}
.tile{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.tile canvas{width:100%;height:auto;display:block;border-radius:6px;background:#fff}
.tile[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:700;box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 22%,transparent)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 4px;display:flex;align-items:center;gap:5px;background:var(--bg);cursor:pointer;font-size:11.5px}
.swatch i{display:flex;border-radius:999px;overflow:hidden}
.swatch i b{width:12px;height:16px;display:block}
.drop{border:1.5px dashed var(--gold);border-radius:12px;padding:16px;text-align:center;background:color-mix(in srgb,var(--gold) 7%,var(--bg));cursor:pointer;line-height:1.7}
.drop strong{color:var(--brand)}
.drop.over{background:color-mix(in srgb,var(--gold) 20%,var(--bg))}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg);cursor:grab;aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .n{position:absolute;top:4px;right:4px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px}
.thumb[aria-selected="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.thumb.dragging{opacity:.4}
.thumb.target{outline:2px dashed var(--brand);outline-offset:-4px}
.editor{background:var(--surface2);border-radius:12px;padding:12px;display:grid;gap:10px}
.editor h3{margin:0;font-size:13px}
.preview{overflow:auto;background:var(--desk);min-width:0;position:relative}
.ptool{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.ptool input[type=range]{width:130px;accent-color:var(--brand)}
.pages{display:flex;flex-direction:column;align-items:center;gap:26px;padding:24px 16px 60px}
.pagecard{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:100%}
.pagecard canvas{display:block;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 10px 28px rgba(60,20,30,.16);max-width:100%;height:auto;cursor:pointer;touch-action:none}
.pagemeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.pagemeta input{flex:1;background:var(--surface);font-size:12.5px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.exportcard{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.exportcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--danger)}
.gallery.five{grid-template-columns:repeat(2,1fr)}
.projects{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.projects[hidden]{display:none}
.projects .wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.projhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.projhead h2{font-family:var(--font-display);color:var(--brand);font-size:26px;margin:0;font-weight:700}
.projhead .grow{flex:1}
.projsearch{max-width:260px}
.syncbox{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.syncbox h3{margin:0;font-size:15px}
.syncbox p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7}
.syncstate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface2)}
.syncstate i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.syncstate.on i{background:#2E8B57}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.cur{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.pcard .th{aspect-ratio:3/4;background:var(--desk);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:12px}
.pcard .th img{max-width:100%;max-height:100%;box-shadow:0 4px 14px rgba(0,0,0,.18);background:#fff}
.pcard .meta{padding:10px 12px;display:grid;gap:6px}
.pcard .nm{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.pcard .sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.pempty{border:1.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.tag{font-size:11px;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 7px;margin-inline-start:6px;font-weight:700}
.tile .tdel{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--danger);font:700 15px/20px Tajawal,sans-serif;text-align:center;opacity:.0;transition:opacity .15s;cursor:pointer;z-index:2}
.tile:hover .tdel,.tile:focus-within .tdel,.tile .tdel:focus-visible{opacity:1}
@media (hover:none){.tile .tdel{opacity:.85}}
.tile .tfav{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--gold);font:700 14px/20px Tajawal,sans-serif;text-align:center;cursor:pointer;z-index:2;opacity:0;transition:opacity .15s}
.tile:hover .tfav,.tile:focus-within .tfav,.tile .tfav.on,.tile .tfav:focus-visible{opacity:1}
.tile .tfav.on{background:var(--gold);color:#fff;border-color:var(--gold)}
@media (hover:none){.tile .tfav{opacity:.85}}
.favbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.librest{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 10px}
@media (max-width: 900px){
  html,body{height:auto}.app{height:auto;display:block}
  .main{display:block}
  .rail{flex-direction:row;border-left:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
  .rail button{flex:0 0 auto;padding:6px 10px}
  .panel{border-left:0;border-bottom:1px solid var(--line);max-height:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview{overflow:visible}
  .ptool{position:static}
  .gallery{grid-template-columns:repeat(4,1fr)}
}
@media (max-width: 480px){.gallery{grid-template-columns:repeat(3,1fr)}.row>label{flex-basis:100%}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
'use strict';
/* ================= state ================= */
const PAGE_SIZES={A4:[210,297],A3:[297,420],A5:[148,210],Letter:[215.9,279.4]};
const DEF={
  docName:'صور حفل التكريم',
  page:{size:'A4',orient:'portrait',perPage:4,layout3:'2+1',mt:10,mr:9,mb:10,ml:9,gap:6,ratio:'5:4',dir:'rtl'},
  border:{style:'corners',color:'#84263E',accent:'#C59D56',width:0.6,inset:5},

  pnum:{on:true,style:'hexline',pos:'center',size:8,color:'#84263E',color2:'#1F3A5F',accent:'#C59D56',format:'n',digits:'latin',start:1},
  header:{on:true,style:'solid',text:'فعاليات مسابقة موسكو السادسة والعشرون 2026',bg:'#84263E',fg:'#FFFFFF',line:'#C59D56',logo:null,logo2:null,sub:'',icons:false,icon:'none',bg2:'#1F3A5F'},
  title:{on:true,text:'صور من حفل تكريم الفائزين بالمسابقة',color:'#84263E',size:16},
  pageTitles:{},pageLayouts:{},
  caption:{on:true,size:3.4,color:'#3A2A30',bold:true},
  cover:{on:false,style:'framed',title:'التقرير المصوّر',subtitle:'حفل تكريم الفائزين بمسابقة موسكو الدولية',date:'نوفمبر 2026',org:'',hero:0},
  qr:{on:false,url:'https://www.muslim.ru/articles/287/47854/',label:'رابط الخبر',pos:'left',size:16,pages:'last'},
  wm:{on:false,type:'text',text:'',opacity:0.3,pos:'bottom-left',size:22},
  exp:{fmt:'word',wordMode:'exact',quality:'high'}
};
let S=JSON.parse(JSON.stringify(DEF));
let IMGS=[]; // {id,src,el,w,h,fit,zoom,ox,oy,rot}
let selId=null, curTab='images';
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);};
const AR_DIGITS='٠١٢٣٤٥٦٧٨٩';
const fmtNum=(n,d)=>d==='arabic'?String(n).replace(/\d/g,x=>AR_DIGITS[x]):String(n);
let LOGO_EL=null,LOGO2_EL=null;

/* ================= geometry helpers ================= */
function rr(p,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.arcTo(x+w,y,x+w,y+r,r);p.lineTo(x+w,y+h-r);p.arcTo(x+w,y+h,x+w-r,y+h,r);p.lineTo(x+r,y+h);p.arcTo(x,y+h,x,y+h-r,r);p.lineTo(x,y+r);p.arcTo(x,y,x+r,y,r);p.closePath();return p}
function RR(b,r){return rr(new Path2D(),b.x,b.y,b.w,b.h,r)}
function cham(b,c,corners=[1,1,1,1]){const {x,y,w,h}=b;c=Math.max(0,Math.min(c,w/2,h/2));const [tl,tr,br,bl]=corners.map(v=>v?c:0);const p=new Path2D();
  p.moveTo(x+tl,y);p.lineTo(x+w-tr,y);p.lineTo(x+w,y+tr);p.lineTo(x+w,y+h-br);p.lineTo(x+w-br,y+h);p.lineTo(x+bl,y+h);p.lineTo(x,y+h-bl);p.lineTo(x,y+tl);p.closePath();return p}
function hexP(b,d){const {x,y,w,h}=b;d=Math.min(d,w/3);const p=new Path2D();p.moveTo(x+d,y);p.lineTo(x+w-d,y);p.lineTo(x+w,y+h/2);p.lineTo(x+w-d,y+h);p.lineTo(x+d,y+h);p.lineTo(x,y+h/2);p.closePath();return p}
function archP(b){const {x,y,w,h}=b;const a=Math.min(w*0.42,h*0.4);const p=new Path2D();p.moveTo(x,y+h);p.lineTo(x,y+a);
  p.bezierCurveTo(x,y+a*0.42,x+w*0.3,y+a*0.1,x+w/2,y);p.bezierCurveTo(x+w*0.7,y+a*0.1,x+w,y+a*0.42,x+w,y+a);p.lineTo(x+w,y+h);p.closePath();return p}
function starP(cx,cy,r,inner=0.7654){const p=new Path2D();for(let i=0;i<16;i++){const a=-Math.PI/2+i*Math.PI/8;const rad=i%2?r*inner:r;const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;i?p.lineTo(px,py):p.moveTo(px,py)}p.closePath();return p}
function polyP(cx,cy,r,n,rot=0){const p=new Path2D();for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?p.lineTo(px,py):p.moveTo(px,py)}p.closePath();return p}
function diaP(cx,cy,rx,ry){const p=new Path2D();p.moveTo(cx,cy-ry);p.lineTo(cx+rx,cy);p.lineTo(cx,cy+ry);p.lineTo(cx-rx,cy);p.closePath();return p}
const ins=(b,d)=>({x:b.x+d,y:b.y+d,w:b.w-2*d,h:b.h-2*d});
function line(ctx,pts,color,w){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='square';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()}
function fillS(ctx,path,color,shadow,u){ctx.save();if(shadow>0){ctx.shadowColor=`rgba(20,10,15,${0.18+shadow*0.5})`;ctx.shadowBlur=u*(1+shadow*3.5);ctx.shadowOffsetY=u*shadow*1.1;}ctx.fillStyle=color;ctx.fill(path);ctx.restore()}
function strokeP(ctx,path,color,w){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineJoin='miter';ctx.stroke(path);ctx.restore()}

/* ================= photo drawing ================= */
const FILTER_OK=(()=>{try{const c=document.createElement('canvas').getContext('2d');return 'filter' in c}catch(e){return false}})();
function drawPhoto(ctx,clip,b,im,noWm){
  const fe=im&&im.el?((im.fe!=null?im.fe:S.frame.feather)||0):0;
  if(fe>0){drawPhotoFeather(ctx,clip,b,im,fe);if(S.wm.on&&!noWm)drawWatermark(ctx,clip,b);return}
  ctx.save();ctx.clip(clip);
  ctx.fillStyle='#F4F1EE';ctx.fillRect(b.x-2,b.y-2,b.w+4,b.h+4);
  if(!im||!im.el){ // placeholder
    ctx.fillStyle='#EDE6E0';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='rgba(132,38,62,.10)';ctx.lineWidth=Math.max(1,b.w/120);
    for(let i=-b.h;i<b.w;i+=b.w/14){ctx.beginPath();ctx.moveTo(b.x+i,b.y);ctx.lineTo(b.x+i+b.h,b.y+b.h);ctx.stroke()}
    ctx.fillStyle='rgba(132,38,62,.55)';ctx.font=`700 ${Math.max(10,b.w/14)}px Tajawal, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText('أضف صورة',b.x+b.w/2,b.y+b.h/2);
    ctx.restore();return;

function stampP(b,r){const {x,y,w,h}=b;const p=new Path2D();const nx=Math.max(3,Math.round(w/(r*3.2))),ny=Math.max(3,Math.round(h/(r*3.2)));const sx=w/nx,sy=h/ny;

  for(let i=0;i<ny;i++){const cy=y+sy*(i+.5);p.lineTo(x+w,cy-r);p.arc(x+w,cy,r,-Math.PI/2,Math.PI/2,true)}p.lineTo(x+w,y+h);
  for(let i=nx-1;i>=0;i--){const cx=x+sx*(i+.5);p.lineTo(cx+r,y+h);p.arc(cx,y+h,r,0,Math.PI,true)}p.lineTo(x,y+h);
  for(let i=ny-1;i>=0;i--){const cy=y+sy*(i+.5);p.lineTo(x,cy+r);p.arc(x,cy,r,Math.PI/2,-Math.PI/2,true)}p.closePath();return p}

/* ================= badges ================= */
const SHAPES=[{id:'circle',name:'دائرة'},{id:'square',name:'مربع'},{id:'diamond',name:'معيّن'},{id:'hex',name:'سداسي'},{id:'octagon',name:'ثماني'},{id:'cut',name:'زوايا مقصوصة'},{id:'star',name:'نجمة ثمانية'},{id:'shield',name:'درع'}];
function shapePath(shape,cx,cy,s){const r=s/2;
  switch(shape){case 'circle':{const p=new Path2D();p.arc(cx,cy,r,0,Math.PI*2);return p}
  case 'square':return rr(new Path2D(),cx-r,cy-r,s,s,s*0.12);
  case 'diamond':return diaP(cx,cy,r*1.12,r*1.12);
  case 'hex':return polyP(cx,cy,r*1.05,6,0);
  case 'octagon':return polyP(cx,cy,r*1.04,8,Math.PI/8);
  case 'cut':return cham({x:cx-r,y:cy-r,w:s,h:s},s*0.26);
  case 'star':return starP(cx,cy,r*1.18,0.78);
  case 'shield':{const p=new Path2D();p.moveTo(cx-r,cy-r*0.9);p.lineTo(cx+r,cy-r*0.9);p.lineTo(cx+r,cy+r*0.15);p.quadraticCurveTo(cx+r*0.9,cy+r*0.8,cx,cy+r*1.1);p.quadraticCurveTo(cx-r*0.9,cy+r*0.8,cx-r,cy+r*0.15);p.closePath();return p}}
}
function drawBadge(ctx,cx,cy,s,shape,fill,stroke,tc,text){
  const p=shapePath(shape,cx,cy,s);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=s*0.12;ctx.shadowOffsetY=s*0.04;ctx.fillStyle=fill;ctx.fill(p);ctx.restore();
  strokeP(ctx,p,stroke,Math.max(1,s*0.085));
  const L=String(text).length;const fs=s*(L>2?0.36:L>1?0.46:0.56)*(shape==='star'||shape==='diamond'?0.88:1);
  ctx.save();ctx.fillStyle=tc;ctx.font=`800 ${fs}px Tajawal, "Segoe UI", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';
  ctx.fillText(String(text),cx,cy+fs*0.06+(shape==='shield'?-s*0.04:0));ctx.restore();
}

/* ================= page numbers ================= */
const PNUMS=[{id:'plain',name:'بسيط'},{id:'circle',name:'دائرة'},{id:'hexline',name:'سداسي بخطوط'},{id:'star',name:'نجمة إسلامية'},{id:'pill',name:'شريط «صفحة»'},{id:'diamond',name:'معيّن ونقاط'},{id:'bar',name:'خط عرضي'},{id:'tab',name:'لسان سفلي'},
 {id:'ring',name:'حلقة مزدوجة'},{id:'tilted',name:'مربع مائل'},{id:'quotes',name:'أقواس «»'},{id:'halfcircle',name:'نصف دائرة'},{id:'banner',name:'وشاح معقود'},{id:'dots',name:'بين نقاط'},{id:'corner',name:'زاوية الصفحة'},{id:'label',name:'دائرة «صفحة»'},
 {id:'octline',name:'ثماني بخطوط'},{id:'shieldp',name:'درع'}];
PNUMS.push(...PQ.map(([id,name])=>({id,name,premium:true})));
function pnText(n,N,P){const a=fmtNum(n,P.digits),b=fmtNum(N,P.digits);return P.format==='nN'?`${a} / ${b}`:a}
function drawPageNum(ctx,u,W,H,L,n,N,P){
  const s=P.size*u, cy=L.pnY*u; const cxs={center:W*u/2,right:(W-L.mr)*u-s*1.6,left:L.ml*u+s*1.6};
  const cx=P.style==='bar'||P.style==='pill'?cxs[P.pos]:cxs[P.pos];const txt=pnText(n,N,P);
  const C=P.color,A=P.accent;
  if(PQMAP[P.style]){const pc=P.pos==='right'?(W-L.mr)*u-s*2.1:P.pos==='left'?L.ml*u+s*2.1:W*u/2;ctx.save();drawPremiumPnum(ctx,pc,cy,s,u,txt,P,PQMAP[P.style]);ctx.restore();return}
  ctx.save();
  const text=(str,x,y,fs,col,w=800)=>{ctx.fillStyle=col;ctx.font=`${w} ${fs}px Tajawal, "Segoe UI", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(str,x,y+fs*0.06)};
  switch(P.style){
  case 'plain':text(`—  ${txt}  —`,cx,cy,s*0.55,C,700);break;
  case 'circle':drawBadge(ctx,cx,cy,s,'circle',C,A,'#fff',txt);break;
  case 'hexline':{const lw=s*2.4;line(ctx,[[cx-s*0.75,cy],[cx-s*0.75-lw,cy]],A,Math.max(1,u*0.35));line(ctx,[[cx+s*0.75,cy],[cx+s*0.75+lw,cy]],A,Math.max(1,u*0.35));
    [[cx-s*0.75-lw,cy],[cx+s*0.75+lw,cy]].forEach(([x,y])=>{ctx.fillStyle=A;ctx.fill(diaP(x,y,u*0.8,u*0.8))});drawBadge(ctx,cx,cy,s,'hex',C,A,'#fff',txt);break;}
  case 'star':drawBadge(ctx,cx,cy,s*1.15,'star',C,A,'#fff',txt);break;
  case 'pill':{const str=P.format==='nN'?`صفحة ${fmtNum(n,P.digits)} من ${fmtNum(N,P.digits)}`:`صفحة ${fmtNum(n,P.digits)}`;ctx.font=`700 ${s*0.42}px Tajawal, sans-serif`;const tw=ctx.measureText(str).width+s*1.2;
    const p=rr(new Path2D(),cx-tw/2,cy-s*0.4,tw,s*0.8,s*0.4);ctx.fillStyle=C;ctx.fill(p);strokeP(ctx,p,A,Math.max(1,u*0.3));text(str,cx,cy,s*0.42,'#fff',700);break;}
  case 'diamond':{[-1,1].forEach(sg=>{for(let i=1;i<=3;i++){ctx.fillStyle=i===1?A:C;ctx.globalAlpha=1-(i-1)*0.25;ctx.beginPath();ctx.arc(cx+sg*(s*0.65+i*s*0.42),cy,u*(0.75-i*0.12),0,7);ctx.fill()}ctx.globalAlpha=1});
    drawBadge(ctx,cx,cy,s,'diamond',C,A,'#fff',txt);break;}
  case 'bar':{const x0=L.ml*u,x1=(W-L.mr)*u;line(ctx,[[x0,cy],[x1,cy]],A,Math.max(1,u*0.3));line(ctx,[[x0,cy+u*0.9],[x1,cy+u*0.9]],C,Math.max(1,u*0.18));
    const bw=s*1.5,p=rr(new Path2D(),cx-bw/2,cy-s*0.42,bw,s*0.84,u*0.6);ctx.fillStyle='#fff';ctx.fill(p);strokeP(ctx,p,C,Math.max(1,u*0.35));text(txt,cx,cy,s*0.46,C);break;}
  case 'tab':{const w=s*1.9,h=s*0.95;const top=cy-h/2;const p=new Path2D();p.moveTo(cx-w/2,top+h);p.lineTo(cx-w/2+h*0.35,top);p.lineTo(cx+w/2-h*0.35,top);p.lineTo(cx+w/2,top+h);p.closePath();
    ctx.fillStyle=C;ctx.fill(p);line(ctx,[[cx-w/2-s,top+h],[cx+w/2+s,top+h]],A,Math.max(1,u*0.45));text(txt,cx,cy+h*0.08,s*0.48,'#fff');break;}
  case 'ring':{ctx.strokeStyle=A;ctx.lineWidth=Math.max(1,u*0.3);ctx.beginPath();ctx.arc(cx,cy,s*0.62,0,7);ctx.stroke();drawBadge(ctx,cx,cy,s*0.95,'circle','#fff',C,C,txt);break;}
  case 'tilted':{const p=diaP(cx,cy,s*0.62,s*0.62);ctx.fillStyle=A;ctx.fill(p);drawBadge(ctx,cx,cy,s*0.78,'square',C,C,'#fff',txt);break;}
  case 'quotes':text(`«  ${txt}  »`,cx,cy,s*0.6,C,800);line(ctx,[[cx-s*1.3,cy+s*0.42],[cx+s*1.3,cy+s*0.42]],A,Math.max(1,u*0.25));break;
  case 'halfcircle':{const R=s*0.85,by=H*u;ctx.fillStyle=C;ctx.beginPath();ctx.arc(cx,by,R,Math.PI,0);ctx.fill();ctx.strokeStyle=A;ctx.lineWidth=Math.max(1,u*0.4);ctx.beginPath();ctx.arc(cx,by,R+u*0.8,Math.PI,0);ctx.stroke();text(txt,cx,by-R*0.45,s*0.46,'#fff');break;}
  case 'banner':{const w=s*2.3,h=s*0.8;const x=cx-w/2,y=cy-h/2;ctx.fillStyle=A;
    [[x,-1],[x+w,1]].forEach(([ex,sg])=>{const p=new Path2D();p.moveTo(ex,y+h*0.25);p.lineTo(ex+sg*h*0.9,y+h*0.25);p.lineTo(ex+sg*h*0.6,y+h*0.75);p.lineTo(ex+sg*h*0.9,y+h*1.25);p.lineTo(ex,y+h*1.25);p.closePath();ctx.fill(p)});
    ctx.fillStyle=C;ctx.fillRect(x,y,w,h);text(txt,cx,cy,s*0.46,'#fff');break;}

/* ================= layout ================= */
function pageDims(){let [w,h]=PAGE_SIZES[S.page.size];if(S.page.orient==='landscape')[w,h]=[h,w];return {W:w,H:h}}
function rowsFor(n,landscape){
  switch(n){case 1:return [1];case 2:return landscape?[2]:[1,1];
  case 3:return S.page.layout3==='2+1'?[2,1]:(landscape?[3]:[1,1,1]);
  case 4:return [2,2];case 6:return landscape?[3,3]:[2,2,2];case 8:return landscape?[4,4]:[2,2,2,2];case 9:return [3,3,3];}
  return [2,2];
}
function ratioVal(){const r=S.page.ratio;if(r==='fill')return null;const [a,b]=r.split(':').map(Number);return a/b}
function numReserve(){if(!S.num.on)return 0;if(S.num.pos==='below')return S.num.size+2;if(S.num.pos==='edge')return S.num.size*0.55;return 0}
function capReserve(){return S.caption.on&&IMGS.some(i=>i.caption)&&!(PFMAP[S.frame.type]&&PFMAP[S.frame.type].label)?S.caption.size*2.7+1.6:0}
const perFor=p=>+(S.pageLayouts[p]||S.page.perPage);
// photo pages plan: which images go on which page (each page can have its own count)
function photoPlan(){const plan=[];const n=IMGS.length;if(!n){plan.push({start:0,count:-1,per:perFor(0)});return plan}
  let i=0,p=0;while(i<n){const per=perFor(p);const c=Math.min(per,n-i);plan.push({start:i,count:c,per});i+=c;p++}return plan}
const hasCover=()=>!!S.cover.on;
function pagesCount(){return photoPlan().length+(hasCover()?1:0)}
function qrOnPage(pp,nPhoto){const Q=S.qr;if(!Q.on||!Q.url)return false;if(Q.pages==='all')return true;if(Q.pages==='first')return pp===0;return pp===nPhoto-1}
function layoutPage(pp,count,per,nPhoto){
  const {W,H}=pageDims();const P=S.page;
  const L={W,H,ml:P.ml,mr:P.mr,cells:[]};
  let y=P.mt;
  if(S.header.on){L.header={x:P.ml,y,w:W-P.ml-P.mr,h:9};y+=9+3.5}
  const ttl=pageTitle(pp);
  if(S.title.on&&ttl){const th=S.title.size*0.3528*1.55;L.title={y,h:th,text:ttl};y+=th+3}
  let yb=H-P.mb;let strip=0;
  if(S.pnum.on){strip=S.pnum.size+3;L.pnY=yb-S.pnum.size/2}
  if(qrOnPage(pp,nPhoto)){const q=S.qr.size;L.qr={x:S.qr.pos==='right'?W-P.mr-q:P.ml,y:yb-q,s:q};strip=Math.max(strip,q+3);if(S.pnum.on)L.pnY=yb-q/2}
  yb-=strip;
  const area={x:P.ml,y,w:W-P.ml-P.mr,h:yb-y};L.area=area;
  const rows=rowsFor(per,P.orient==='landscape');const maxC=Math.max(...rows);const R=rows.length;const g=P.gap;const nr=numReserve()+capReserve();
  let cw=(area.w-g*(maxC-1))/maxC, ch=(area.h-g*(R-1))/R;
  let fw=cw,fh=ch-nr;const rv=ratioVal();
  if(rv){fw=Math.min(cw,fh*rv);fh=fw/rv}
  const blockH=R*(fh+nr)+(R-1)*g;
  let yy=area.y+Math.max(0,(area.h-blockH)*0.3);
  let k=0,left=count;
  rows.forEach(full=>{const n=Math.max(0,Math.min(full,left));left-=n;const rowW=n*fw+(n-1)*g;let xs=area.x+(area.w-rowW)/2;
    for(let i=0;i<n;i++){const idx=P.dir==='rtl'?n-1-i:i;const x=xs+idx*(fw+g);
      L.cells.push({x,y:yy,w:fw,h:fh,slot:k});k++}
    yy+=fh+nr+g});
  return L;
}
function pageTitle(pp){const v=S.pageTitles[pp];return (v!==undefined&&v!==null&&v!=='')?v:S.title.text}

/* ================= render page ================= */
// ti = page index in the document (cover counts). Returns layout with .imgs/.start for photo pages, or {cover:true}.
function renderPage(ctx,u,ti,mode={}){
  const {W,H}=pageDims();
  if(!mode.transparent){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W*u,H*u)}
  if(hasCover()&&ti===0){if(!mode.skipDecor||mode.coverFull)renderCover(ctx,u,W,H);return {W,H,cover:true,cells:[]}}
  const pp=ti-(hasCover()?1:0);const plan=photoPlan();const e=plan[pp]||plan[plan.length-1];
  const imgs=e.count<0?[]:IMGS.slice(e.start,e.start+e.count);
  const L=layoutPage(pp,e.count<0?e.per:e.count,e.per,plan.length);L.start=e.start;L.imgs=imgs;L.pp=pp;
  if(!mode.skipDecor) drawPageBorder(ctx,u,W,H);
  if(L.header&&!mode.skipDecor) drawHeader(ctx,u,L.header,S.header);
  if(L.title&&!mode.skipTitle){ctx.fillStyle=S.title.color;const fs=S.title.size*0.3528*u;ctx.font=`800 ${fs}px Tajawal, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';ctx.fillText(L.title.text,W*u/2,(L.title.y+L.title.h/2)*u)}
  if(!mode.skipCells) L.cells.forEach(c=>drawCell(ctx,u,c,imgs[c.slot],e.start+c.slot));
  if(S.pnum.on&&!mode.skipDecor) drawPageNum(ctx,u,W,H,L,pp+S.pnum.start,plan.length+S.pnum.start-1,S.pnum);
  if(L.qr&&!mode.skipDecor) drawQR(ctx,u,L.qr);
  return L;
}

const QR_CACHE={};
function qrMatrix(text){if(QR_CACHE[text])return QR_CACHE[text];if(!window.qrcode)return null;try{const q=window.qrcode(0,'M');q.addData(unescape(encodeURIComponent(text)));q.make();const n=q.getModuleCount();const m=[];for(let r=0;r<n;r++){m.push([]);for(let c=0;c<n;c++)m[r].push(q.isDark(r,c))}return QR_CACHE[text]=m}catch(e){return null}}
function drawQR(ctx,u,q){const m=qrMatrix(S.qr.url);const x=q.x*u,y=q.y*u,s=q.s*u;
  ctx.fillStyle='#fff';ctx.fillRect(x-u,y-u,s+2*u,s+2*u);strokeP(ctx,RR({x:x-u,y:y-u,w:s+2*u,h:s+2*u},u*0.8),S.pnum.accent,u*0.3);
  if(m){const n=m.length,cs=s/n;ctx.fillStyle='#1B1416';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])ctx.fillRect(x+c*cs,y+r*cs,cs+0.4,cs+0.4)}
  else{ctx.fillStyle='#EEE';ctx.fillRect(x,y,s,s)}
  if(S.qr.label){ctx.fillStyle=S.pnum.color;ctx.font=`700 ${u*3.2}px Tajawal, sans-serif`;ctx.textBaseline='middle';ctx.direction='rtl';
    if(S.qr.pos==='right'){ctx.textAlign='right';ctx.fillText(S.qr.label,x-u*2.5,y+s/2)}else{ctx.textAlign='left';ctx.direction='ltr';ctx.save();ctx.direction='rtl';ctx.textAlign='left';ctx.fillText(S.qr.label,x+s+u*2.5,y+s/2);ctx.restore()}}}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
// read DateTimeOriginal from a JPEG's EXIF block (returns ms timestamp or null)
function exifDate(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-4){const mk=v.getUint16(o);const len=v.getUint16(o+2);
    if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10;const le=v.getUint16(t)===0x4949;const g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
      const readIFD=(off,want)=>{const n=g16(t+off);for(let i=0;i<n;i++){const e=t+off+2+i*12;if(g16(e)===want)return e}return null};
      let dt=null;const ifd0=g32(t+4);const ex=readIFD(ifd0,0x8769);
      const str=(e)=>{const cnt=g32(e+4),p=t+g32(e+8);let s='';for(let k=0;k<cnt-1;k++)s+=String.fromCharCode(v.getUint8(p+k));return s};
      if(ex){const e=readIFD(g32(ex+8),0x9003);if(e)dt=str(e)}if(!dt){const e=readIFD(ifd0,0x0132);if(e)dt=str(e)}
      if(dt){const m=dt.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime()}return null}
    if((mk&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return null}
async function fileToImg(file){
  let taken=null;try{if(/jpe?g/i.test(file.type))taken=exifDate(await file.slice(0,256*1024).arrayBuffer())}catch(e){}
  const src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  let el=await loadImg(src);const MAX=2600;
  if(Math.max(el.width,el.height)>MAX){const k=MAX/Math.max(el.width,el.height);const c=document.createElement('canvas');c.width=Math.round(el.width*k);c.height=Math.round(el.height*k);c.getContext('2d').drawImage(el,0,0,c.width,c.height);const s2=c.toDataURL('image/jpeg',0.9);el=await loadImg(s2);return {src:s2,el,taken:taken||file.lastModified||null}}

const newImg=(o)=>({id:uid(),fit:'cover',zoom:1,ox:0,oy:0,rot:0,tilt:0,br:1,ct:1,sat:1,caption:'',...o});
async function addFiles(files){

// auto-enhance: measure brightness and spread on a small copy, then set brightness/contrast/saturation
function autoEnhance(im){const c=document.createElement('canvas');const k=120/Math.max(im.w,im.h);c.width=Math.max(1,Math.round(im.w*k));c.height=Math.max(1,Math.round(im.h*k));
  const g=c.getContext('2d');g.drawImage(im.el,0,0,c.width,c.height);let d;try{d=g.getImageData(0,0,c.width,c.height).data}catch(e){return false}
  let sum=0,sum2=0,n=0,satSum=0;for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2];const L=(0.299*r+0.587*gg+0.114*b)/255;sum+=L;sum2+=L*L;n++;const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);satSum+=mx?(mx-mn)/mx:0}

  im.br=+clamp(0.5/Math.max(0.12,mean),0.8,1.45).toFixed(2);im.ct=+clamp(0.22/Math.max(0.05,sd),0.9,1.35).toFixed(2);im.sat=+clamp(0.38/Math.max(0.08,sat),0.95,1.3).toFixed(2);return true}

const DBN='lawh-studio';let persistT=null,syncT=null;let CUR_ID=null;let DIR=null;let lastSync=null;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,3);r.onupgradeneeded=()=>{const d=r.result;['p','projects','meta','imgs'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function dbOp(store,mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const st=tx.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)})}
const dbGet=(s,k)=>dbOp(s,'readonly',st=>st.get(k));
const dbPut=(s,k,v)=>dbOp(s,'readwrite',st=>st.put(v,k));
const dbDel=(s,k)=>dbOp(s,'readwrite',st=>st.delete(k));
const dbAll=(s)=>dbOp(s,'readonly',st=>st.getAll());
// المشروع يُحفظ بإعداداته فقط، وكل صورة تُحفظ مرة واحدة وحدها في مخزن «imgs»
function projectData(){return {v:3,id:CUR_ID,name:S.docName||'بدون اسم',updated:Date.now(),S,images:IMGS.map(({el,src,...r})=>r)}}
const STORED=new Set();
async function storeImgs(list){const todo=list.filter(im=>im&&im.src&&im.id&&!STORED.has(im.id));if(!todo.length)return;
  try{await dbOp('imgs','readwrite',st=>{let r;todo.forEach(im=>{r=st.put(im.src,im.id)});return r});todo.forEach(im=>STORED.add(im.id))}catch(e){}}
async function fullData(d){const images=[];for(const r of (d.images||[])){if(r.src){images.push(r);continue}let src=null;const m=IMGS.find(x=>x.id===r.id);if(m)src=m.src;if(!src){try{src=await dbGet('imgs',r.id)}catch(e){}}if(src)images.push({...r,src})}return {...d,images}}
async function gcImgs(){try{const all=await dbAll('projects');const keep=new Set(IMGS.map(x=>x.id));all.forEach(p=>((p.data&&p.data.images)||[]).forEach(r=>keep.add(r.id)));
  const keys=await dbOp('imgs','readonly',st=>st.getAllKeys());const del=(keys||[]).filter(k=>!keep.has(k));if(del.length)await dbOp('imgs','readwrite',st=>{let r;del.forEach(k=>{r=st.delete(k);STORED.delete(k)});return r})}catch(e){}}
function makeThumb(){try{const {W,H}=pageDims();const u=150/W;const cv=document.createElement('canvas');cv.width=Math.round(W*u);cv.height=Math.round(H*u);renderPage(cv.getContext('2d'),u,0);return cv.toDataURL('image/jpeg',0.7)}catch(e){return ''}}
async function saveCurrent(){
  if(!CUR_ID)CUR_ID=uid();S.docName=$('#docName').value||S.docName;await storeImgs(IMGS);const d=projectData();
  const rec={id:CUR_ID,name:d.name,updated:d.updated,count:IMGS.length,pages:pagesCount(),thumb:makeThumb(),data:d};

}
function persist(){clearTimeout(persistT);persistT=setTimeout(async()=>{await saveCurrent();if(DIR&&S.autoSync!==false){clearTimeout(syncT);syncT=setTimeout(()=>writeToFolder(CUR_ID,true),12000)}},800)}
async function applyProject(d){
  if(!d||!d.S)throw new Error('bad');S=deepMerge(JSON.parse(JSON.stringify(DEF)),d.S);
  IMGS=[];for(const r of (d.images||[])){try{let src=r.src,inline=!!src;if(!src)src=await dbGet('imgs',r.id);if(!src)continue;const el=await loadImg(src);IMGS.push({...r,src,el,w:el.naturalWidth,h:el.naturalHeight});if(!inline)STORED.add(r.id)}catch(e){}}
  LOGO_EL=S.header.logo?await loadImg(S.header.logo).catch(()=>null):null;LOGO2_EL=S.header.logo2?await loadImg(S.header.logo2).catch(()=>null):null;
  CUR_ID=d.id||uid();S.docName=S.docName||d.name||'';$('#docName').value=S.docName||'';selId=null;
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')a[k]=deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
async function restore(){

    const old=await dbGet('p','current');if(old&&old.S){await applyProject(old);CUR_ID=uid();await saveCurrent();await dbDel('p','current');return true}

async function writeToFolder(id,quiet){
  if(!DIR||!(await dirPerm(!quiet)))return false;
  try{const rec=await dbGet('projects',id);if(!rec)return false;
    const stale=[];for await(const [name,h] of DIR.entries()){if(h.kind==='file'&&name.endsWith(`__${id}.lawh.json`)&&name!==fileNameFor(rec))stale.push(name)}
    let fh;try{fh=await DIR.getFileHandle(fileNameFor(rec),{create:true})}catch(e){fh=await DIR.getFileHandle(`lawh__${id}.lawh.json`,{create:true})}const full=await fullData(rec.data);const w=await fh.createWritable();await w.write(JSON.stringify(full));await w.close();for(const n of stale){if(n!==fh.name){try{await DIR.removeEntry(n)}catch(e){}}}lastSync=Date.now();updateSyncState();return true}
  catch(e){return false}
}
async function syncFolder(ask){
  if(!DIR){toast('اربط مجلد OneDrive أولاً');return}
  if(!(await dirPerm(ask))){toast('اسمح للمتصفح بالوصول إلى المجلد لإكمال المزامنة');return}
  await saveCurrent();let up=0,down=0;const local=await dbAll('projects');const byId=Object.fromEntries(local.map(r=>[r.id,r]));const seen=new Set();
  for await(const [name,h] of DIR.entries()){
    if(h.kind!=='file'||!name.endsWith('.lawh.json'))continue;
    try{const f=await h.getFile();const d=JSON.parse(await f.text());if(!d||!d.S)continue;const id=d.id||name.replace(/\.lawh\.json$/,'');d.id=id;seen.add(id);
      const L=byId[id];const remoteT=d.updated||f.lastModified;
      if(!L||remoteT>(L.updated||0)+1000){const tmpS=S,tmpI=IMGS,tmpL=LOGO_EL,tmpC=CUR_ID;await applyProject(d);await storeImgs(IMGS);const rec={id,name:d.name||S.docName,updated:remoteT,count:IMGS.length,pages:pagesCount(),thumb:makeThumb(),data:{...projectData(),id,updated:remoteT}};
        S=tmpS;IMGS=tmpI;LOGO_EL=tmpL;CUR_ID=tmpC;$('#docName').value=S.docName||'';await dbPut('projects',id,rec);down++;
        if(id===CUR_ID){await applyProject(rec.data);CUR_ID=id}}
      else if(L&&(L.updated||0)>remoteT+1000){await writeToFolder(id,true);up++}
    }catch(e){}
  }
  for(const r of local){if(!seen.has(r.id)){await writeToFolder(r.id,true);up++}}
  lastSync=Date.now();updateSyncState();resetView();renderProjects();toast(`اكتملت المزامنة: ${up} رُفع، ${down} نُزّل`);
}

async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});toast('تم حفظ '+name);return true}}}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('تم تنزيل '+name);return true;
}

async function pageCanvas(pi,u,mode){const {W,H}=pageDims();const cv=document.createElement('canvas');cv.width=Math.round(W*u);cv.height=Math.round(H*u);const L=renderPage(cv.getContext('2d'),u,pi,mode);return {cv,L}}

async function buildPDF(){

  const pdf=new window.jspdf.jsPDF({orientation:W>H?'landscape':'portrait',unit:'mm',format:[W,H],compress:true});
  for(let i=0;i<N;i++){setProg(i/N,`تجهيز الصفحة ${i+1} من ${N}…`);await nextFrame();const {cv}=await pageCanvas(i,u,{});if(i)pdf.addPage([W,H],W>H?'landscape':'portrait');pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,H,undefined,'FAST')}

const nextFrame=()=>new Promise(r=>setTimeout(r,0));

// each photo with its frame, number and caption as a transparent sprite (mm position + canvas)
function cellSprites(L,u){const out=[];for(const c of L.cells){const im=(L.imgs||[])[c.slot];if(!im&&IMGS.length)continue;const m=4;const extra=numReserve()+capReserve()+2;

  out.push({cv,x:c.x-m,y:c.y-m,w:c.w+2*m,h:c.h+2*m+extra,slot:c.slot})}return out}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('تعذّر تحميل مكتبة PowerPoint'));document.head.appendChild(s)})}

    if(hasCover()&&i===0){const {cv}=await pageCanvas(i,u,{});slide.addImage({data:cv.toDataURL('image/jpeg',0.92),x:0,y:0,w:W/IN,h:H/IN});continue}

let exporting=false;
async function doExport(){
  if(exporting)return;if(!window.JSZip||!window.jspdf){toast('مكتبات التصدير لم تُحمَّل بعد، تحقق من الاتصال ثم أعد المحاولة');return}
  exporting=true;const btn=$('#btnExport');if(btn)btn.disabled=true;
  try{await document.fonts.ready;const name=safeName();const f=S.exp.fmt;
    if(f==='word'){const b=await buildDOCX();setProg(1,'اكتمل');await saveFile(name+'.docx',b)}
    else if(f==='pdf'){const b=await buildPDF();setProg(1,'اكتمل');await saveFile(name+'.pdf',b)}
    else if(f==='pptx'){const b=await buildPPTX();setProg(1,'اكتمل');await saveFile(name+'.pptx',b)}
    else if(f==='png'){const b=await buildPNGs();setProg(1,'اكتمل');await saveFile(name+' - صور الصفحات.zip',b)}
    else{const d=await buildDOCX();const p=await buildPDF();const z=new JSZip();z.file(name+'.docx',d);z.file(name+'.pdf',p);const zb=await z.generateAsync({type:'blob'});setProg(1,'اكتمل');await saveFile(name+'.zip',zb)}

let LIB_HIDDEN=(()=>{try{return JSON.parse(localStorage.getItem('lawh-hidden')||'{}')||{}}catch(e){return {}}})();

function libSave(){try{localStorage.setItem('lawh-hidden',JSON.stringify(LIB_HIDDEN))}catch(e){}persist()}
function decorateLib(){
  Object.entries(LIB_KINDS).forEach(([gid,[kind,label]])=>{const g=document.getElementById(gid);if(!g)return;const hid=LIB_HIDDEN[kind]||[];const fav=LIB_FAV[kind]||[];
    // المفضلة: نجمة على كل تصميم، والمفضل يتقدّم أول القائمة
    g.querySelectorAll('.tile[data-v]').forEach(t=>{const v=t.dataset.v;if(t.querySelector('.tfav'))return;const on=fav.includes(v);t.classList.toggle('isfav',on);
      const st=document.createElement('span');st.className='tfav'+(on?' on':'');st.setAttribute('role','button');st.tabIndex=0;st.title=on?'إزالة من المفضلة':'إضافة إلى المفضلة';st.setAttribute('aria-pressed',on);st.textContent=on?'★':'☆';
      const tg=e=>{e.stopPropagation();e.preventDefault();const L=new Set(LIB_FAV[kind]||[]);L.has(v)?L.delete(v):L.add(v);LIB_FAV[kind]=[...L];favSave();renderPanel()};
      st.addEventListener('click',tg);st.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')tg(e)});t.style.position='relative';t.appendChild(st)});
    [...g.querySelectorAll('.tile.isfav')].reverse().forEach(t=>t.parentElement.prepend(t));
    if(!g.previousElementSibling||!g.previousElementSibling.classList.contains('favbar')){const bar=document.createElement('div');bar.className='favbar';g.insertAdjacentElement('beforebegin',bar)}
    const bar=g.previousElementSibling;const nf=fav.length;
    bar.innerHTML=`<button type="button" class="btn small${LIB_ONLY[kind]?' primary':''}" ${nf?'':'disabled'}>★ المفضلة فقط${nf?' ('+nf+')':''}</button><span>${nf?'':'اضغط ☆ على أي تصميم لإضافته إلى المفضلة'}</span>`;
    bar.querySelector('button').onclick=()=>{LIB_ONLY[kind]=!LIB_ONLY[kind];renderPanel()};
    if(LIB_ONLY[kind]&&nf)g.querySelectorAll('.tile[data-v]').forEach(t=>{if(!fav.includes(t.dataset.v)&&t.getAttribute('aria-pressed')!=='true')t.hidden=true});
    g.querySelectorAll('.tile[data-v]').forEach(t=>{const v=t.dataset.v;
      if(hid.includes(v)&&t.getAttribute('aria-pressed')!=='true'){t.remove();return}
      if(t.querySelector('.tdel'))return;const x=document.createElement('span');x.className='tdel';x.setAttribute('role','button');x.tabIndex=0;x.title='حذف من القائمة';x.setAttribute('aria-label','حذف هذا '+label+' من القائمة');x.textContent='×';
      const go=e=>{e.stopPropagation();e.preventDefault();if(t.getAttribute('aria-pressed')==='true'){toast('هذا التصميم مستخدم الآن. اختر غيره أولاً ثم احذفه');return}
        LIB_HIDDEN[kind]=[...new Set([...(LIB_HIDDEN[kind]||[]),v])];libSave();t.remove();addRestore(g,kind,label);toast('حُذف من القائمة، ويمكنك استعادته')};
      x.addEventListener('click',go);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go(e)});t.style.position='relative';t.appendChild(x)});
    addRestore(g,kind,label)});
}
function addRestore(g,kind,label){const n=(LIB_HIDDEN[kind]||[]).length;let r=g.parentElement.querySelector(`.librest[data-k="${kind}"]`);

    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();drop.classList.add('over')}}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));

    const bc=$('#btnClear');if(bc)bc.onclick=()=>{$('#clearWrap').innerHTML='<span class="confirm">حذف كل الصور؟ <button class="btn small danger" id="clrYes" type="button">نعم، احذف</button><button class="btn small" id="clrNo" type="button">تراجع</button></span>';
      $('#clrYes').onclick=()=>{IMGS=[];selId=null;renderPanel();schedule()};$('#clrNo').onclick=renderPanel};
    let dragI=null;
    document.querySelectorAll('.thumb').forEach(t=>{const i=+t.dataset.i;
      t.onclick=()=>{selId=IMGS[i].id;renderPanel();schedule();scrollToImg(i)};
      t.onkeydown=e=>{if(e.key==='Enter'){t.click()}};
      t.addEventListener('dragstart',e=>{dragI=i;t.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i))});
      t.addEventListener('dragend',()=>{t.classList.remove('dragging');document.querySelectorAll('.thumb.target').forEach(x=>x.classList.remove('target'))});
      t.addEventListener('dragover',e=>{if(dragI!==null){e.preventDefault();t.classList.add('target')}});
      t.addEventListener('dragleave',()=>t.classList.remove('target'));
      t.addEventListener('drop',e=>{if(dragI!==null){e.preventDefault();const f=dragI;dragI=null;moveImg(f,i)}})});

      $('#imRot').onclick=()=>{im.rot=((im.rot||0)+90)%360;schedule()};

    $('#hLogo').onclick=()=>{LOGO_TARGET=1;$('#logoFile').click()};const l2=$('#hLogo2');if(l2)l2.onclick=()=>{LOGO_TARGET=2;$('#logoFile').click()};
    const l2d=$('#hLogo2Del');if(l2d)l2d.onclick=()=>{T.logo2=null;LOGO2_EL=null;renderPanel();schedule()};bindText('hSub',T,'sub',refreshTiles);bindColor('hBg2',T,'bg2',refreshTiles);document.querySelectorAll('#hIconGal .tile').forEach(b=>b.onclick=()=>{T.icon=b.dataset.v;T.icons=false;document.querySelectorAll('#hIconGal .tile').forEach(x=>x.setAttribute('aria-pressed',x===b));schedule();refreshTiles()});const ld=$('#hLogoDel');if(ld)ld.onclick=()=>{T.logo=null;LOGO_EL=null;renderPanel();schedule()};
    bindToggle('tOn',Ti,'on');bindText('tText',Ti,'text');bindColor('tColor',Ti,'color');bindRange('tSize',Ti,'size','نقطة');
    document.querySelectorAll('#hGal .tile').forEach(b=>b.onclick=()=>{T.style=b.dataset.v;document.querySelectorAll('#hGal .tile').forEach(x=>x.setAttribute('aria-pressed',x===b));schedule()});
    document.querySelectorAll('#bGal .tile').forEach(b=>b.onclick=()=>{B.style=b.dataset.v;document.querySelectorAll('#bGal .tile').forEach(x=>x.setAttribute('aria-pressed',x===b));schedule()});
    ['hBg','hFg','hLine','hText','bColor','bAccent'].forEach(id=>{const el=document.getElementById(id);el&&el.addEventListener('input',refreshTiles)});bindColor('bColor',B,'color');bindColor('bAccent',B,'accent');bindRange('bWidth',B,'width','ملم');bindRange('bInset',B,'inset','ملم')}
  if(curTab==='cover'){const C=S.cover;bindToggle('cOn',C,'on');bindText('cTitle',C,'title',refreshTiles);bindText('cSub',C,'subtitle',refreshTiles);bindText('cDate',C,'date');bindText('cOrg',C,'org');
    document.querySelectorAll('#cGal .tile').forEach(b=>b.onclick=()=>{C.style=b.dataset.v;C.on=true;$('#cOn').checked=true;document.querySelectorAll('#cGal .tile').forEach(x=>x.setAttribute('aria-pressed',x===b));schedule()});
    document.querySelectorAll('[data-hero]').forEach(t=>t.onclick=()=>{C.hero=+t.dataset.hero;document.querySelectorAll('[data-hero]').forEach(x=>x.setAttribute('aria-selected',x===t));schedule();refreshTiles()})}
  if(curTab==='extras'){const C=S.caption,Q=S.qr,M=S.wm;bindToggle('capOn',C,'on');bindRange('capSize',C,'size','ملم');bindColor('capColor',C,'color');bindToggle('capBold',C,'bold');
    bindToggle('qrOn',Q,'on');bindText('qrUrl',Q,'url');bindText('qrLabel',Q,'label');bindSeg('qrPos',Q,'pos');bindSeg('qrPages',Q,'pages');bindRange('qrSize',Q,'size','ملم');
    bindToggle('wmOn',M,'on');bindSeg('wmType',M,'type',renderPanel);bindText('wmText',M,'text');bindSelect('wmPos',M,'pos');bindRange('wmOp',M,'opacity');bindRange('wmSize',M,'size','%')}
  if(curTab==='templates')wireTemplates();
  if(curTab==='export'){const E=S.exp;bindSeg('eFmt',E,'fmt',renderPanel);bindSeg('eMode',E,'wordMode',renderPanel);bindSeg('eQ',E,'quality');$('#btnExport').onclick=doExport}
}
function scrollToImg(i){const pi=Math.floor(i/S.page.perPage);const card=$('#pages').children[pi];if(card)card.scrollIntoView({behavior:'smooth',block:'nearest'})}

/* ================= global wiring ================= */
$('#imgFiles').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#replaceFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';const im=IMGS.find(x=>x.id===selId);if(!f||!im)return;try{const {src,el}=await fileToImg(f);Object.assign(im,{id:uid(),src,el,w:el.naturalWidth,h:el.naturalHeight,zoom:1,ox:0,oy:0,rot:0,name:f.name});selId=im.id;renderPanel();schedule();toast('استُبدلت الصورة')}catch(err){toast('تعذّر قراءة الصورة')}};
let LOGO_TARGET=1;$('#logoFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const {src,el}=await fileToImg(f);if(LOGO_TARGET===2){S.header.logo2=src;LOGO2_EL=el}else{S.header.logo=src;LOGO_EL=el}renderPanel();schedule();refreshTiles()}catch(err){toast('تعذّر قراءة الشعار')}};
$('#zoom').oninput=schedule;
$('#docName').oninput=()=>{S.docName=$('#docName').value;persist()};
window.addEventListener('beforeunload',()=>{try{saveCurrent()}catch(e){}});
$('#btnGoExport').onclick=()=>showTab('export');
$('#btnProjects').onclick=showProjects;
$('#btnSaveNow').onclick=async()=>{await saveCurrent();let msg='حُفظ «'+(S.docName||'المشروع')+'» في مشاريعي';if(DIR&&await writeToFolder(CUR_ID,false))msg+=' وفي OneDrive';toast(msg)};
$('#btnSaveNew').onclick=saveAndNew;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#projects').hidden)hideProjects();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#btnSaveNow').click()}});
$('#projFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());await saveCurrent();await applyProject(d);const ex=await dbGet('projects',CUR_ID);if(ex&&ex.updated>(d.updated||0)){CUR_ID=uid()}await saveCurrent();hideProjects();resetView();toast('فُتح المشروع وأضيف إلى مشاريعي')}catch(err){toast('هذا الملف ليس مشروعاً صالحاً من استوديو لَوح')}};
const pw=$('#previewWrap');
pw.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault()});
pw.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
window.addEventListener('resize',schedule);

(async function boot(){
  buildRail();
  const ok=await restore();
  if(!ok){for(const src of makeSamples()){try{const el=await loadImg(src);IMGS.push(newImg({src,el,w:el.naturalWidth,h:el.naturalHeight,name:'صورة نموذجية'}))}catch(e){}}
    if(IMGS[0])IMGS[0].caption='صورة نموذجية';CUR_ID=uid();S.docName='مشروع نموذجي';$('#docName').value=S.docName;}
  renderPanel();renderPreview();
  try{await document.fonts.load('800 20px Tajawal');await document.fonts.load('700 20px Tajawal');}catch(e){}
  renderPreview();refreshTiles();
})();
</script>
